<svg xmlns="http://www.w3.org/2000/svg" width="1149" height="561" viewBox="0 0 1149 561" role="img" aria-labelledby="title desc">
  <title id="title">Lit-It practice landing page preview</title>
  <desc id="desc">A cream colored Lit-It landing page with large text reading Let a theme find you and an open theme book showing Freedom.</desc>
  <defs>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="19" flood-color="#3b3024" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#6d5b45" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="pageFold" x1="0" x2="1">
      <stop offset="0" stop-color="#fefbf5"/>
      <stop offset="0.9" stop-color="#f4eee3"/>
      <stop offset="1" stop-color="#ddd0bd"/>
    </linearGradient>
  </defs>
  <rect width="1149" height="561" fill="#f4efe6"/>
  <line x1="0" y1="53" x2="1149" y2="53" stroke="#ded3c4"/>
  <text x="28" y="29" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#8a213f">Lit-It</text>
  <text x="934" y="30" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#5d5b58">History</text>
  <text x="1007" y="30" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#5d5b58">About &amp; Privacy</text>
  <text x="27" y="134" font-family="Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="7" fill="#806b20">ONE WORD. ONE PARAGRAPH.</text>
  <text x="28" y="211" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#2d2825">Let a theme find</text>
  <text x="28" y="291" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#2d2825">you.</text>
  <text x="28" y="332" font-family="Arial, sans-serif" font-size="16" fill="#595450">Flip for a literary theme, write your reflection, and let the feedback</text>
  <text x="28" y="360" font-family="Arial, sans-serif" font-size="16" fill="#595450">reveal your current English level.</text>
  <rect x="27" y="401" width="149" height="50" fill="#842744"/>
  <text x="51" y="432" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#ffffff">Flip the pages</text>
  <rect x="188" y="401" width="144" height="50" fill="none" stroke="#d6cbbc"/>
  <text x="209" y="432" font-family="Arial, sans-serif" font-size="16" fill="#79614e">Refresh topics</text>
  <text x="28" y="477" font-family="Arial, sans-serif" font-size="12" fill="#7c6954">Themes generated for your next reflection.</text>
  <g filter="url(#bookShadow)">
    <rect x="631" y="172" width="396" height="283" fill="#d2c3ad" opacity="0.46"/>
    <rect x="619" y="166" width="409" height="284" fill="#dbcdbb" opacity="0.6"/>
    <rect x="607" y="162" width="222" height="280" fill="#fffcf7" stroke="#d5c9bb"/>
    <rect x="828" y="162" width="222" height="280" fill="url(#pageFold)" stroke="#d5c9bb"/>
    <path d="M828 162v280" stroke="#d1c2b1" stroke-width="2"/>
    <path d="M998 183h31v31M1029 390v32h-32" fill="none" stroke="#c48e42"/>
    <text x="636" y="202" font-family="Arial, sans-serif" font-weight="700" font-size="10" letter-spacing="6" fill="#806b20">LIT-IT THEME BOOK</text>
    <text x="636" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#0f1d2e">Open a page.</text>
    <text x="636" y="291" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#0f1d2e">Follow a</text>
    <text x="636" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#0f1d2e">thought.</text>
    <text x="636" y="379" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#842744">One word, one</text>
    <text x="636" y="407" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#842744">paragraph.</text>
    <text x="879" y="275" font-family="Arial, sans-serif" font-weight="700" font-size="10" letter-spacing="7" fill="#806b20">A THEME AWAITS</text>
    <text x="856" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="45" fill="#842744">Freedom</text>
  </g>
</svg>
